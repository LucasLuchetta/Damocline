name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          files="$(find cmd internal -type f -name '*.go')"
          test -z "$(gofmt -l $files)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/damocline

  preview-binaries:
    name: Preview CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build native Windows and Linux CLIs
        shell: bash
        run: |
          mkdir -p dist
          mkdir -p dist/windows-amd64 dist/linux-amd64 dist/linux-arm64 dist/macos-amd64 dist/macos-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/windows-amd64/damocline.exe ./cmd/damocline
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/linux-amd64/damocline ./cmd/damocline
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/linux-arm64/damocline ./cmd/damocline
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/macos-amd64/damocline ./cmd/damocline
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/macos-arm64/damocline ./cmd/damocline
      - uses: actions/upload-artifact@v4
        with:
          name: damocline-preview-binaries
          path: dist/*
          if-no-files-found: error
