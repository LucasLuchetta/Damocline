name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Format, vet, test, and run source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Normalize formatting for validation
        run: go fmt ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Compile from source (CI only)
        run: go build -o /tmp/damocline-check ./cmd/damocline
      - name: Smoke test source CLI
        run: go run ./cmd/damocline help

# CI intentionally does not upload Windows .exe or other prebuilt binaries.
