name: format updater once
on:
  push:
    branches: [feat/source-auto-update]
permissions:
  contents: write
jobs:
  gofmt:
    if: github.repository == 'LucasLuchetta/Damocline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-auto-update
          persist-credentials: true
      - name: Format new Go code
        run: |
          gofmt -w internal/updater/*.go internal/cli/update.go
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/updater internal/cli/update.go
          if ! git diff --cached --quiet; then
            git commit -m "style: gofmt updater sources"
            git push origin HEAD:feat/source-auto-update
          fi
