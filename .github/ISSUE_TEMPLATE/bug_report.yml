name: Bug report
description: Report a reproducible defect, not a security vulnerability.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Damocline is pre-alpha. Do not post security vulnerabilities or secrets here; see SECURITY.md."
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Prefer local fixtures and redact sensitive details.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Commit / OS / Go version
